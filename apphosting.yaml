# Firebase App Hosting configuration.
#
# The NEXT_PUBLIC values below are not secrets: Next.js inlines them into the
# JavaScript that every visitor downloads. Firebase web config is public by
# design, the security lives in firestore.rules and storage.rules.
# Real secrets belong in Secret Manager: the Resend API key is read by the
# Cloud Functions, the two Stripe secrets at the end by this app, at runtime
# only.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://joinpairspace.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAtST6G5tGT7_lnccZzqILxU7fvCi7vzbg
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: pairspace-live.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: pairspace-live
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: pairspace-live.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 865487163332
    availability:
      - BUILD
      - RUNTIME
  # PostHog project "Pairspace" (EU, id 337522), public like the Firebase config.
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: phc_BrDpe58XRZydDUHQe6NfsKHyh6emh8HjSqUkWhki5Sr3
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:865487163332:web:c15d2ca59a21af1fd7de91
    availability:
      - BUILD
      - RUNTIME
  # Stripe, from Secret Manager. `node scripts/stripe-setup.mjs` creates both.
  # Without them /api/abo grants one free trial and nothing more.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
